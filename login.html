<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — AURELIA Atelier</title>
  <meta name="description" content="Sign in to your AURELIA Atelier account." />
  <meta property="og:title" content="Log In — AURELIA Atelier" />
  <meta property="og:description" content="Access your account, orders, and wishlist at AURELIA Atelier." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body class="bg-[#F8F7F4] text-[#282c3f] font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#121212] selection:text-white">

  <!-- Header Anchor -->
  <div id="app-header" class="min-h-[116px]"></div>

  <main class="flex-1 max-w-5xl mx-auto px-4 sm:px-6 w-full py-10 sm:py-16 flex items-center justify-center">

    <!-- Split Fashion Authentication Card -->
    <div class="bg-white border border-[#eae8e3] w-full grid grid-cols-1 md:grid-cols-12 shadow-xl overflow-hidden">
      
      <!-- Left Column: Editorial Lifestyle Campaign Visual (Desktop) -->
      <div class="md:col-span-5 relative bg-[#121212] text-white p-8 sm:p-10 flex flex-col justify-between min-h-[300px] md:min-h-[520px]">
        <img 
          src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=900&auto=format&fit=crop&q=80" 
          alt="Atelier Fashion Silhouette" 
          class="absolute inset-0 w-full h-full object-cover opacity-35" 
        />
        <div class="relative z-10">
          <span class="text-[9px] uppercase tracking-[0.3em] text-[#eae8e3] font-semibold block mb-2">Member Benefits</span>
          <h2 class="font-editorial text-2xl sm:text-3xl font-normal leading-snug">
            Welcome to AURELIA
          </h2>
        </div>

        <div class="relative z-10 space-y-3 pt-6 border-t border-white/20 text-xs">
          <div class="flex items-start gap-2.5">
            <span class="text-[#c25e40] font-bold">&bull;</span>
            <span class="text-[#d4d4d4]">Free doorstep alteration and easy returns</span>
          </div>
          <div class="flex items-start gap-2.5">
            <span class="text-[#c25e40] font-bold">&bull;</span>
            <span class="text-[#d4d4d4]">Early access to new season arrivals</span>
          </div>
          <div class="flex items-start gap-2.5">
            <span class="text-[#c25e40] font-bold">&bull;</span>
            <span class="text-[#d4d4d4]">Fast and secure delivery across India</span>
          </div>
        </div>
      </div>

      <!-- Right Column: Login Form -->
      <div class="md:col-span-7 p-8 sm:p-12 flex flex-col justify-center space-y-6">
        
        <div>
          <span class="text-[10px] tracking-[0.25em] uppercase text-[#737373] font-bold block mb-1">Account Log In</span>
          <h1 class="font-editorial text-2xl sm:text-3xl text-[#121212] font-normal">Log In to Your Account</h1>
          <p class="text-xs text-[#737373] mt-1 font-light">
            Enter your credentials to access your orders and saved wishlist.
          </p>
        </div>

        <form id="login-form" class="space-y-4 text-xs">
          <div>
            <label for="login-email" class="block font-bold text-[#121212] mb-1.5 text-[10px] uppercase tracking-wider">
              Email Address *
            </label>
            <input 
              type="email" 
              id="login-email" 
              required 
              autocomplete="username"
              placeholder="client@aurelia.com"
              value="member@aurelia.com" 
              class="w-full bg-[#faf9f6] border border-[#eae8e3] p-3 text-[#121212] focus:outline-none focus:border-[#121212] transition" 
            />
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label for="login-password" class="block font-bold text-[#121212] text-[10px] uppercase tracking-wider">
                Password *
              </label>
              <button type="button" class="text-[11px] text-[#737373] hover:text-[#121212] cursor-pointer">Forgot password?</button>
            </div>
            
            <div class="relative">
              <input 
                type="password" 
                id="login-password" 
                required 
                autocomplete="current-password"
                value="atelier2026" 
                class="w-full bg-[#faf9f6] border border-[#eae8e3] p-3 pr-10 text-[#121212] focus:outline-none focus:border-[#121212] transition" 
              />
              <button 
                type="button" 
                id="toggle-login-password" 
                class="absolute right-3 top-1/2 -translate-y-1/2 text-[#737373] hover:text-[#121212] p-1 cursor-pointer"
                title="Toggle password visibility"
              >
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs pt-1">
            <label class="flex items-center gap-2 text-[#525252] cursor-pointer">
              <input type="checkbox" checked class="accent-[#121212]" />
              <span class="text-[11px]">Remember me</span>
            </label>

            <button 
              type="button" 
              id="demo-fill-login" 
              class="text-[11px] font-semibold text-[#c25e40] hover:underline cursor-pointer"
            >
              Auto-Fill Demo
            </button>
          </div>

          <div class="pt-2">
            <button 
              type="submit" 
              class="w-full bg-[#121212] hover:bg-black text-[#faf9f6] font-bold tracking-[0.16em] uppercase py-3.5 transition shadow-sm cursor-pointer active:scale-[0.99]"
            >
              Log In
            </button>
          </div>
        </form>

        <div class="text-center text-xs text-[#737373] pt-4 border-t border-[#eae8e3]">
          <span>New to AURELIA? </span>
          <a href="/signup.html" id="link-to-signup" class="font-bold text-[#121212] underline hover:text-[#525252]">Create an Account</a>
        </div>

      </div>

    </div>

  </main>

  <!-- Footer Anchor -->
  <div id="app-footer"></div>

  <script type="module" src="/src/js/pages/auth.js"></script>
</body>
</html>
