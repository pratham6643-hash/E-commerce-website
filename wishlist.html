<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist — AURELIA Atelier</title>
  <meta name="description" content="Your saved wishlist items at AURELIA Atelier." />
  <meta property="og:title" content="My Wishlist — AURELIA Atelier" />
  <meta property="og:description" content="Revisit your saved wishlist items at AURELIA Atelier." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body class="bg-[#F8F7F4] text-[#282c3f] font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#121212] selection:text-white">

  <!-- Header Anchor -->
  <div id="app-header" class="min-h-[116px]"></div>

  <main class="flex-1 max-w-[1680px] mx-auto px-4 sm:px-6 lg:px-8 xl:px-12 w-full py-6 sm:py-8">

    <!-- Wishlist Header -->
    <div class="flex flex-col sm:flex-row sm:items-end justify-between pb-5 border-b border-[#eaeaec] mb-8 gap-4">
      <div>
        <nav class="text-[11px] font-semibold text-[#94969f] mb-1.5" aria-label="Breadcrumb">
          <a href="/index.html" class="hover:text-[#121212] transition">Home</a> / 
          <span class="text-[#282c3f] font-bold">My Wishlist</span>
        </nav>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-[#282c3f] tracking-tight">
          My Saved Wishlist
        </h1>
      </div>
      
      <span id="wishlist-item-count" class="text-xs font-bold text-[#282c3f] border border-[#eaeaec] bg-white px-4 py-2 shadow-2xs self-start sm:self-auto rounded-xs">
        0 Items
      </span>
    </div>

    <!-- Empty State -->
    <div id="wishlist-empty" class="hidden bg-white border border-[#eae8e3] p-12 sm:p-16 text-center max-w-lg mx-auto my-12 space-y-5 shadow-2xs">
      <div class="w-16 h-16 rounded-full bg-[#faf9f6] border border-[#eae8e3] flex items-center justify-center mx-auto text-[#a3a3a3]">
        <i data-lucide="heart" class="w-8 h-8"></i>
      </div>
      <div>
        <h2 class="font-editorial text-2xl sm:text-3xl text-[#121212]">Your Wishlist is Empty</h2>
        <p class="text-xs text-[#737373] font-light leading-relaxed mt-2 max-w-sm mx-auto">
          Save your favorite items here to buy them anytime.
        </p>
      </div>
      <div>
        <a href="/shop.html" class="inline-block bg-[#121212] text-white text-xs font-bold tracking-[0.18em] uppercase px-8 py-3.5 hover:bg-black transition shadow-sm">
          Continue Shopping
        </a>
      </div>
    </div>

    <!-- Wishlist Grid -->
    <div 
      id="wishlist-grid" 
      class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 sm:gap-6 min-h-[350px]"
      aria-live="polite"
    >
      <!-- Populated via wishlist.js -->
    </div>

  </main>

  <!-- Size Selection Modal for Move to Bag -->
  <div id="size-select-modal" class="fixed inset-0 z-50 hidden">
    <div id="size-modal-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-xs"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white shadow-2xl p-6 sm:p-7 space-y-5">
      
      <div class="flex items-center justify-between pb-3 border-b border-[#eae8e3]">
        <h3 class="text-xs font-bold uppercase tracking-wider text-[#121212]">Select Size</h3>
        <button type="button" id="close-size-modal" class="p-1 text-[#737373] hover:text-[#121212]">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Item Preview Mini Block -->
      <div class="flex items-center gap-3 bg-[#faf9f6] p-3 border border-[#eae8e3]">
        <img id="modal-product-img" src="" alt="" class="w-12 h-16 object-cover bg-white shrink-0" />
        <div class="min-w-0">
          <span id="modal-product-brand" class="text-[9px] uppercase tracking-wider text-[#737373] font-semibold block">Brand</span>
          <h4 id="modal-product-name" class="text-xs font-medium text-[#121212] truncate">Product Name</h4>
          <span id="modal-product-price" class="text-xs font-bold text-[#121212] block mt-0.5">₹0</span>
        </div>
      </div>

      <!-- Size Pills Container -->
      <div class="space-y-2">
        <span class="text-[10px] font-bold uppercase tracking-wider text-[#121212] block">Available Sizes:</span>
        <div id="modal-sizes-container" class="flex flex-wrap gap-2.5">
          <!-- Populated dynamically -->
        </div>
        <p id="modal-size-error" class="hidden text-xs text-[#c25e40] font-medium pt-1">Please select an available size to proceed.</p>
      </div>

      <!-- Modal Action Buttons -->
      <div class="pt-2 flex gap-3">
        <button 
          type="button" 
          id="modal-cancel-btn" 
          class="flex-1 py-3 border border-[#eae8e3] text-xs font-bold uppercase tracking-wider text-[#525252] hover:border-[#121212]"
        >
          Cancel
        </button>
        <button 
          type="button" 
          id="modal-confirm-btn" 
          class="flex-1 py-3 bg-[#121212] text-white text-xs font-bold uppercase tracking-wider hover:bg-black transition"
        >
          Add to Bag
        </button>
      </div>

    </div>
  </div>

  <!-- Footer Anchor -->
  <div id="app-footer"></div>

  <script type="module" src="/src/js/pages/wishlist.js"></script>
</body>
</html>
